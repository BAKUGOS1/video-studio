<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/InstrumentSerif-Regular.ttf") format("truetype");
        font-style: normal;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/InstrumentSerif-Italic.ttf") format("truetype");
        font-style: italic;
      }
      @font-face {
        font-family: "Outfit";
        src: url("assets/fonts/Outfit.ttf") format("truetype");
        font-weight: 100 900;
      }
      :root {
        --ground: #fbf5ea;
        --maroon: #7a1530;
        --gold: #c9a23a;
        --ink: #2a1a12;
        --muted: #6f5a4c;
        --serif: "Instrument Serif", Georgia, serif;
        --sans: "Outfit", Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: radial-gradient(120% 90% at 70% 40%, #fffaf1 0%, var(--ground) 60%, #f3e8d6 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="16"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="screens"
        data-composition-id="screens"
        data-composition-src="compositions/screens.html"
        data-start="3"
        data-duration="9"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="12"
        data-duration="4"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
